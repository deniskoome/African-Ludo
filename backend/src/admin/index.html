<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>African Ludo Push Notifications</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; background: #f8f9fb; }
    h1 { color: #1f3a60; }
    form { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    input, textarea, select { width: 100%; padding: 10px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #d0d7de; }
    button { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; }
    button.primary { background: #1f3a60; color: #fff; }
    button.secondary { background: #e0e7ff; color: #1f3a60; margin-left: 8px; }
    .status { margin-top: 12px; font-weight: bold; }
    .status.ok { color: #0f7b3f; }
    .status.error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Push Notifications</h1>
  <form id="pushForm">
    <label for="projectId">FCM Project ID</label>
    <input id="projectId" name="projectId" type="text" readonly />

    <label for="senderVersion">Sender Version</label>
    <select id="senderVersion" name="senderVersion" disabled>
      <option value="v1">FCM v1</option>
      <option value="legacy">Legacy</option>
    </select>

    <label for="serviceAccount">Service Account JSON</label>
    <input id="serviceAccount" name="serviceAccount" type="file" accept="application/json" />

    <div>
      <button type="submit" class="primary">Save</button>
      <button type="button" id="testPush" class="secondary">Test Push</button>
    </div>
  </form>

  <div class="status" id="status"></div>

  <script>
    async function loadSettings() {
      const res = await fetch('/admin/push-settings');
      if (!res.ok) {
        document.getElementById('status').textContent = 'Unable to load settings';
        document.getElementById('status').className = 'status error';
        return;
      }
      const json = await res.json();
      document.getElementById('projectId').value = json.projectId || '********';
      document.getElementById('senderVersion').value = json.senderVersion;
    }

    document.getElementById('pushForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const fileInput = document.getElementById('serviceAccount');
      if (!fileInput.files.length) {
        document.getElementById('status').textContent = 'Please choose a JSON file to upload';
        document.getElementById('status').className = 'status error';
        return;
      }
      const formData = new FormData();
      formData.append('serviceAccount', fileInput.files[0]);
      const res = await fetch('/admin/push-settings', {
        method: 'POST',
        body: formData
      });
      if (res.ok) {
        document.getElementById('status').textContent = 'Credentials saved';
        document.getElementById('status').className = 'status ok';
        fileInput.value = '';
        loadSettings();
      } else {
        const error = await res.json();
        document.getElementById('status').textContent = error.error || 'Unable to save credentials';
        document.getElementById('status').className = 'status error';
      }
    });

    document.getElementById('testPush').addEventListener('click', async () => {
      const token = prompt('Enter a device token to test');
      if (!token) return;
      const res = await fetch('/admin/test-push', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token })
      });
      const statusEl = document.getElementById('status');
      if (res.ok) {
        statusEl.textContent = 'Test push sent successfully';
        statusEl.className = 'status ok';
      } else {
        const error = await res.json();
        statusEl.textContent = error.error || 'Test push failed';
        statusEl.className = 'status error';
      }
    });

    loadSettings();
  </script>
</body>
</html>
